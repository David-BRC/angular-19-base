<section class="user-list">
  <h2>{{ title }}</h2>

  <p *ngIf="loading">Loading…</p>

  <ng-container *ngIf="(users$ | async) as users">
    <p *ngIf="users.length === 0" class="empty">No users.</p>

    <ul *ngIf="users.length > 0">
      <li *ngFor="let u of users" (click)="pick(u)">
        {{ u.name }}
        <span *ngIf="showRoles" class="role">({{ u.role }})</span>
      </li>
    </ul>
  </ng-container>
</section>
